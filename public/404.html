<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/AnimeSalt.png" />
  <title>404 Not Found · AnimeSalt API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text: #f5f7fb;
      --muted: rgba(245, 247, 251, 0.7);
      --radius: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 80% 0%, rgba(125, 211, 252, 0.16), transparent 50%),
        radial-gradient(800px 500px at 10% 90%, rgba(196, 181, 253, 0.14), transparent 45%),
        #07090f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('/background.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(7, 9, 15, 0.6), rgba(7, 9, 15, 0.9));
      z-index: 0;
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .code {
      font-size: 4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #bae6fd, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border);
      color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.9rem;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.16); }
    .btn-primary {
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.85), rgba(167, 139, 250, 0.8));
      color: #0b1020; border-color: transparent;
    }
    .credit { margin-top: 28px; font-size: 0.75rem; color: var(--muted); }
    .credit strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>This route does not exist. Check the docs or return to the homepage.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Home</a>
      <a class="btn" href="/docs.html">Docs</a>
    </div>
    <div class="credit">Built by <strong>Dark &amp; Pyro Team</strong></div>
  </div>
</body>
</html>
